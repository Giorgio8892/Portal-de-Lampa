<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Condominio Portal de Lampa | El Pellín 1770</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para compilar JSX directamente en el navegador (ideal para GitHub Pages) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ============================================================================
    // CREDENCIALES FIJAS DE SUPABASE (CONDOMINIO PORTAL DE LAMPA)
    // ============================================================================
    const DEFAULT_SUPABASE_URL = "https://ewksfaamizxugjxhxyiu.supabase.co";
    const DEFAULT_SUPABASE_KEY = "sb_publishable_Z-79MDbqVfis18UYIkh53Q_lz5-N0Ok";
    const DEFAULT_ADMIN_PIN = "1770";

    const TORRES = ['A', 'B', 'C', 'D', 'E', 'F'];
    const PISOS = [1, 2, 3, 4];
    const DPTOS_POR_PISO = [1, 2, 3, 4];

    const generarBaseInicial96Dptos = () => {
      const lista = [];
      TORRES.forEach((torre) => {
        PISOS.forEach((piso) => {
          DPTOS_POR_PISO.forEach((num) => {
            const id = `${torre}${piso}${num}`;
            lista.push({
              id,
              torre,
              piso,
              numero: num,
              residente: `Residente Dpto ${id} (Por empadronar)`,
              rut: 'Pendiente',
              propietario: 'Por verificar',
              telefono: '',
              email: '',
              registro_verificado: false,
              estado: 'Al día',
              gasto_base: 68000,
              agua_caliente: 12000,
              fondo_reserva: 3400,
              multas: 0,
              saldo_anterior: 0,
              pagado: 83400,
              ultima_actualizacion: '15/11/2026'
            });
          });
        });
      });
      return lista;
    };

    const EGRESOS_INICIALES = [
      { id: 'EGR-01', categoria: 'Remuneraciones Conserjería y Aseo', proveedor: 'Personal de Planta (6 Turnos)', monto: 3850000, fecha: '05/11/2026', estado: 'Pagado' },
      { id: 'EGR-02', categoria: 'Electricidad Espacios Comunes y Bombas', proveedor: 'Enel Distribución', monto: 980000, fecha: '08/11/2026', estado: 'Pagado' },
      { id: 'EGR-03', categoria: 'Agua Potable y Riego Áreas Verdes', proveedor: 'Aguas Andinas / Red Lampa', monto: 720000, fecha: '10/11/2026', estado: 'Pagado' },
      { id: 'EGR-04', categoria: 'Mantención Portón Eléctrico y Citofonía', proveedor: 'Seguridad Industrial SpA', monto: 420000, fecha: '12/11/2026', estado: 'Pagado' },
      { id: 'EGR-05', categoria: 'Insumos de Aseo y Mantención Jardines', proveedor: 'Comercial Lampa Verde', monto: 310000, fecha: '14/11/2026', estado: 'Pagado' }
    ];

    const COMUNICADOS_INICIALES = [
      {
        id: 'COM-01',
        titulo: 'Bienvenidos al Portal Oficial - Condominio Portal de Lampa',
        fecha: '15/11/2026',
        prioridad: 'Alta',
        mensaje: 'Vecinos de El Pellín 1770: Ya se encuentra habilitado nuestro portal digital para las 6 torres (A a F). Por favor ingresen a la pestaña "Registrar mi WhatsApp / Mis Datos" para recibir sus colillas y avisos directamente en su teléfono.'
      },
      {
        id: 'COM-02',
        titulo: 'Mantención Preventiva Sala de Bombas Hidropack',
        fecha: '14/11/2026',
        prioridad: 'Media',
        mensaje: 'Este miércoles entre las 10:00 y 12:30 hrs se realizará inspección técnica programada en el sistema de impulsión de agua de las Torres A a la F.'
      }
    ];

    const SOLICITUDES_INICIALES = [
      {
        id: 'SOL-101',
        dpto: 'A12',
        vecino: 'Vecina Dpto A12',
        telefono: '',
        tipo: 'Detalle de Consumo / Gasto Común',
        asunto: 'Consulta lectura de agua caliente mes actual',
        mensaje: 'Hola Administración, quisiera solicitar el desglose de mi consumo de este mes y saber cómo recibo el comprobante.',
        fecha: '15/11/2026',
        estado: 'Pendiente',
        respuesta: ''
      }
    ];

    const formatCLP = (valor) => {
      const num = Number(valor) || 0;
      return '$' + num.toLocaleString('es-CL');
    };

    const calcularTotalDeuda = (d) => {
      const totalMes = (Number(d.gasto_base) || 0) + (Number(d.agua_caliente) || 0) + (Number(d.fondo_reserva) || 0) + (Number(d.multas) || 0) + (Number(d.saldo_anterior) || 0);
      return Math.max(0, totalMes - (Number(d.pagado) || 0));
    };

    const calcularTotalFacturado = (d) => {
      return (Number(d.gasto_base) || 0) + (Number(d.agua_caliente) || 0) + (Number(d.fondo_reserva) || 0) + (Number(d.multas) || 0) + (Number(d.saldo_anterior) || 0);
    };

    function App() {
      // INICIA SIEMPRE EN MODO VECINO POR DEFECTO
      const [role, setRole] = useState('habitante');
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [adminPin, setAdminPin] = useState(DEFAULT_ADMIN_PIN);

      // Pestañas
      const [adminTab, setAdminTab] = useState('dashboard');
      const [vecinoTab, setVecinoTab] = useState('colilla');

      // Selección de departamento en Modo Vecino
      const [selectedTorreVecino, setSelectedTorreVecino] = useState('A');
      const [selectedDptoVecino, setSelectedDptoVecino] = useState('A11');

      // Base de datos principal
      const [departamentos, setDepartamentos] = useState(() => generarBaseInicial96Dptos());
      const [egresos, setEgresos] = useState(EGRESOS_INICIALES);
      const [comunicados, setComunicados] = useState(COMUNICADOS_INICIALES);
      const [solicitudes, setSolicitudes] = useState(SOLICITUDES_INICIALES);

      // Estado de conexión Supabase
      const [supabaseUrl, setSupabaseUrl] = useState(DEFAULT_SUPABASE_URL);
      const [supabaseKey, setSupabaseKey] = useState(DEFAULT_SUPABASE_KEY);
      const [syncStatus, setSyncStatus] = useState('Conectando a Supabase...');
      const [isSyncing, setIsSyncing] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // Configuración WhatsApp
      const [whatsappConfig, setWhatsappConfig] = useState({
        modoPrueba: true,
        numeroPrueba: '+56987654321',
        nombreAdmin: 'Administración Condominio Portal de Lampa'
      });
      const [waPreviewModal, setWaPreviewModal] = useState(null);

      // Filtros en Administrador
      const [filtroTorre, setFiltroTorre] = useState('TODAS');
      const [filtroEstado, setFiltroEstado] = useState('TODOS');
      const [busquedaDpto, setBusquedaDpto] = useState('');
      const [vistaMapa, setVistaMapa] = useState(true);

      // Modal Edición de Departamento (Admin)
      const [editingDpto, setEditingDpto] = useState(null);

      // Modal Respuesta Solicitud (Admin)
      const [respondingSolicitud, setRespondingSolicitud] = useState(null);
      const [respuestaTexto, setRespuestaTexto] = useState('');

      // Formularios Nuevos (Egreso y Comunicado)
      const [nuevoEgreso, setNuevoEgreso] = useState({ categoria: '', proveedor: '', monto: '' });
      const [nuevoComunicado, setNuevoComunicado] = useState({ titulo: '', prioridad: 'Media', mensaje: '' });

      // Formularios del Vecino (Auto-registro y Nueva Solicitud)
      const [formRegistroVecino, setFormRegistroVecino] = useState({
        residente: '',
        rut: '',
        propietario: 'Propietario',
        telefono: '+569',
        email: ''
      });
      const [nuevaSolicitud, setNuevaSolicitud] = useState({
        tipo: 'Detalle de Consumo / Gasto Común',
        asunto: '',
        mensaje: '',
        telefonoContacto: ''
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4000);
      };

      // ========================================================================
      // CONEXIÓN REST CON SUPABASE
      // ========================================================================
      const getSupabaseHeaders = () => ({
        'apikey': supabaseKey.trim(),
        'Authorization': `Bearer ${supabaseKey.trim()}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation,resolution=merge-duplicates'
      });

      const cargarDesdeSupabase = async (silencioso = false) => {
        const cleanUrl = supabaseUrl.trim().replace(/\/$/, '');
        if (!cleanUrl || !supabaseKey) return;
        setIsSyncing(true);
        try {
          const resDptos = await fetch(`${cleanUrl}/rest/v1/departamentos?select=*&order=id.asc`, {
            headers: getSupabaseHeaders()
          });
          if (resDptos.ok) {
            const data = await resDptos.json();
            if (Array.isArray(data) && data.length > 0) {
              setDepartamentos(data);
              setSyncStatus(`Conectado en línea (${data.length} dptos en Supabase)`);
              if (!silencioso) showToast(`Sincronizado: ${data.length} departamentos cargados desde Supabase`);
            } else {
              setSyncStatus('Conectado a Supabase (Tabla vacía, usando base local)');
            }
          } else {
            setSyncStatus('Modo Local Activo (Verifica políticas RLS en Supabase)');
          }

          // Intentar cargar solicitudes, egresos y comunicados si existen
          const resSol = await fetch(`${cleanUrl}/rest/v1/solicitudes?select=*&order=id.desc`, { headers: getSupabaseHeaders() });
          if (resSol.ok) {
            const dataSol = await resSol.json();
            if (Array.isArray(dataSol) && dataSol.length > 0) setSolicitudes(dataSol);
          }

          const resCom = await fetch(`${cleanUrl}/rest/v1/comunicados?select=*&order=id.desc`, { headers: getSupabaseHeaders() });
          if (resCom.ok) {
            const dataCom = await resCom.json();
            if (Array.isArray(dataCom) && dataCom.length > 0) setComunicados(dataCom);
          }
        } catch (err) {
          setSyncStatus('Operando en memoria local');
        } finally {
          setIsSyncing(false);
        }
      };

      const guardarDptoEnSupabase = async (dptoActualizado) => {
        const cleanUrl = supabaseUrl.trim().replace(/\/$/, '');
        try {
          const res = await fetch(`${cleanUrl}/rest/v1/departamentos`, {
            method: 'POST',
            headers: getSupabaseHeaders(),
            body: JSON.stringify(dptoActualizado)
          });
          return res.ok;
        } catch (e) {
          return false;
        }
      };

      const sincronizar96DptosASupabase = async () => {
        const cleanUrl = supabaseUrl.trim().replace(/\/$/, '');
        setIsSyncing(true);
        try {
          const res = await fetch(`${cleanUrl}/rest/v1/departamentos`, {
            method: 'POST',
            headers: getSupabaseHeaders(),
            body: JSON.stringify(departamentos)
          });
          if (res.ok) {
            setSyncStatus('¡96 Departamentos sincronizados en Supabase!');
            showToast('¡Los 96 departamentos quedaron guardados en tu Supabase!');
          } else {
            showToast('Error al subir a Supabase. Verifica la tabla departamentos.');
          }
        } catch (err) {
          showToast('Error de red al conectar con Supabase.');
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        cargarDesdeSupabase(true);
      }, []);

      // Sincronizar datos del formulario de auto-registro cuando el vecino cambia de dpto
      const dptoVecinoActual = useMemo(() => {
        return departamentos.find((d) => d.id === selectedDptoVecino) || departamentos[0];
      }, [departamentos, selectedDptoVecino]);

      useEffect(() => {
        if (dptoVecinoActual) {
          setFormRegistroVecino({
            residente: dptoVecinoActual.residente.includes('(Por empadronar)') ? '' : dptoVecinoActual.residente,
            rut: dptoVecinoActual.rut === 'Pendiente' ? '' : dptoVecinoActual.rut,
            propietario: dptoVecinoActual.propietario === 'Por verificar' ? 'Propietario' : dptoVecinoActual.propietario,
            telefono: dptoVecinoActual.telefono || '+569',
            email: dptoVecinoActual.email || ''
          });
          setNuevaSolicitud((prev) => ({
            ...prev,
            telefonoContacto: dptoVecinoActual.telefono || '+569'
          }));
        }
      }, [dptoVecinoActual]);

      // Estadísticas Globales Financieras
      const stats = useMemo(() => {
        let totalFacturado = 0;
        let totalRecaudado = 0;
        let totalPorCobrar = 0;
        let totalFondoReserva = 0;
        let alDia = 0;
        let pendientes = 0;
        let morosos = 0;
        let empadronados = 0;

        departamentos.forEach((d) => {
          const fact = calcularTotalFacturado(d);
          const deuda = calcularTotalDeuda(d);
          totalFacturado += fact;
          totalRecaudado += Number(d.pagado) || 0;
          totalPorCobrar += deuda;
          totalFondoReserva += Number(d.fondo_reserva) || 0;

          if (d.estado === 'Al día') alDia++;
          else if (d.estado === 'Pendiente') pendientes++;
          else morosos++;

          if (d.telefono && d.telefono.trim().length >= 8) empadronados++;
        });

        const totalEgresos = egresos.reduce((acc, e) => acc + (Number(e.monto) || 0), 0);
        const porcentajeRecaudacion = totalFacturado > 0 ? Math.round((totalRecaudado / totalFacturado) * 100) : 0;

        return {
          totalFacturado,
          totalRecaudado,
          totalPorCobrar,
          totalFondoReserva,
          totalEgresos,
          saldoCaja: totalRecaudado - totalEgresos,
          alDia,
          pendientes,
          morosos,
          empadronados,
          porcentajeRecaudacion
        };
      }, [departamentos, egresos]);

      // Departamentos filtrados para la tabla del Administrador
      const dptosFiltrados = useMemo(() => {
        return departamentos.filter((d) => {
          if (filtroTorre !== 'TODAS' && d.torre !== filtroTorre) return false;
          if (filtroEstado === 'SIN_WHATSAPP' && d.telefono && d.telefono.trim().length >= 8) return false;
          if (filtroEstado !== 'TODOS' && filtroEstado !== 'SIN_WHATSAPP' && d.estado !== filtroEstado) return false;
          if (busquedaDpto.trim() !== '') {
            const q = busquedaDpto.toLowerCase();
            return d.id.toLowerCase().includes(q) || (d.residente && d.residente.toLowerCase().includes(q));
          }
          return true;
        });
      }, [departamentos, filtroTorre, filtroEstado, busquedaDpto]);

      // Función para preparar y abrir WhatsApp
      const abrirModalWhatsApp = (dptoId, nombreVecino, telefonoVecino, motivo, detalleTexto) => {
        const destinoReal = telefonoVecino && telefonoVecino.trim().length >= 8 ? telefonoVecino.trim() : '';
        const numeroElegido = whatsappConfig.modoPrueba ? whatsappConfig.numeroPrueba : (destinoReal || whatsappConfig.numeroPrueba);
        const numLimpio = numeroElegido.replace(/[^0-9]/g, '');

        const mensajeCompleto =
          `🏢 *CONDOMINIO PORTAL DE LAMPA*\n` +
          `📍 *Dirección:* El Pellín 1770, Lampa\n` +
          `----------------------------------\n` +
          `Hola *${nombreVecino}* (*Dpto ${dptoId}*):\n\n` +
          `Le informamos respecto a: *${motivo}*\n\n` +
          `${detalleTexto}\n\n` +
          `Atentamente,\n` +
          `*${whatsappConfig.nombreAdmin}*`;

        const urlWa = `https://wa.me/${numLimpio}?text=${encodeURIComponent(mensajeCompleto)}`;
        setWaPreviewModal({
          dptoId,
          nombreVecino,
          telefonoReal: destinoReal || 'No registrado aún',
          numeroEnvio: numeroElegido,
          modoPrueba: whatsappConfig.modoPrueba,
          mensajeCompleto,
          urlWa
        });
      };

      // Guardar edición de un departamento (Modo Admin)
      const handleSaveDpto = async (e) => {
        e.preventDefault();
        if (!editingDpto) return;

        const deuda = calcularTotalDeuda(editingDpto);
        const estadoCalculado = deuda === 0 ? 'Al día' : editingDpto.estado === 'Al día' ? 'Pendiente' : editingDpto.estado;

        const actualizado = {
          ...editingDpto,
          estado: estadoCalculado,
          ultima_actualizacion: new Date().toLocaleDateString('es-CL')
        };

        setDepartamentos((prev) => prev.map((d) => (d.id === actualizado.id ? actualizado : d)));
        setEditingDpto(null);
        await guardarDptoEnSupabase(actualizado);
        showToast(`Departamento ${actualizado.id} actualizado en la base de datos`);
      };

      // Conciliar Pago Rápido en 1 Clic (Modo Admin)
      const conciliarPagoTotal = async (dpto) => {
        const totalMes = calcularTotalFacturado(dpto);
        const actualizado = {
          ...dpto,
          pagado: totalMes,
          estado: 'Al día',
          ultima_actualizacion: new Date().toLocaleDateString('es-CL')
        };
        setDepartamentos((prev) => prev.map((item) => (item.id === dpto.id ? actualizado : item)));
        await guardarDptoEnSupabase(actualizado);
        showToast(`Pago conciliado para Dpto ${dpto.id} (${formatCLP(totalMes)})`);
      };

      // Auto-registro de WhatsApp por parte del Vecino
      const handleVecinoGuardarDatos = async (e) => {
        e.preventDefault();
        if (!formRegistroVecino.residente.trim() || !formRegistroVecino.telefono.trim()) {
          showToast('Por favor ingresa tu nombre y número de WhatsApp');
          return;
        }
        const actualizado = {
          ...dptoVecinoActual,
          residente: formRegistroVecino.residente.trim(),
          rut: formRegistroVecino.rut.trim() || 'Verificado',
          propietario: formRegistroVecino.propietario,
          telefono: formRegistroVecino.telefono.trim(),
          email: formRegistroVecino.email.trim(),
          registro_verificado: true,
          ultima_actualizacion: new Date().toLocaleDateString('es-CL')
        };

        setDepartamentos((prev) => prev.map((d) => (d.id === actualizado.id ? actualizado : d)));
        await guardarDptoEnSupabase(actualizado);
        showToast(`¡Datos y WhatsApp del Dpto ${actualizado.id} guardados con éxito!`);
        setVecinoTab('colilla');
      };

      // Enviar solicitud del Vecino a la Administración
      const handleVecinoEnviarSolicitud = async (e) => {
        e.preventDefault();
        if (!nuevaSolicitud.asunto.trim() || !nuevaSolicitud.mensaje.trim()) {
          showToast('Completa el asunto y el detalle de tu solicitud');
          return;
        }

        const telIngresado = nuevaSolicitud.telefonoContacto.trim();
        const nueva = {
          id: `SOL-${Math.floor(100 + Math.random() * 900)}`,
          dpto: selectedDptoVecino,
          vecino: dptoVecinoActual.residente,
          telefono: telIngresado || dptoVecinoActual.telefono || '',
          tipo: nuevaSolicitud.tipo,
          asunto: nuevaSolicitud.asunto.trim(),
          mensaje: nuevaSolicitud.mensaje.trim(),
          fecha: new Date().toLocaleDateString('es-CL'),
          estado: 'Pendiente',
          respuesta: ''
        };

        setSolicitudes((prev) => [nueva, ...prev]);

        // Si el vecino anotó su WhatsApp en la solicitud, actualizamos su ficha automáticamente
        if (telIngresado && telIngresado.length >= 8 && telIngresado !== dptoVecinoActual.telefono) {
          const dptoUpd = { ...dptoVecinoActual, telefono: telIngresado, registro_verificado: true };
          setDepartamentos((prev) => prev.map((d) => (d.id === dptoUpd.id ? dptoUpd : d)));
          await guardarDptoEnSupabase(dptoUpd);
        }

        // Guardar en tabla solicitudes de Supabase si está disponible
        try {
          const cleanUrl = supabaseUrl.trim().replace(/\/$/, '');
          await fetch(`${cleanUrl}/rest/v1/solicitudes`, {
            method: 'POST',
            headers: getSupabaseHeaders(),
            body: JSON.stringify(nueva)
          });
        } catch (err) {}

        setNuevaSolicitud({ tipo: 'Detalle de Consumo / Gasto Común', asunto: '', mensaje: '', telefonoContacto: telIngresado });
        showToast(`Solicitud enviada a la Administración del Condominio Portal de Lampa`);
      };

      // Responder solicitud como Administrador
      const guardarRespuestaSolicitud = async (enviarPorWa) => {
        if (!respondingSolicitud || !respuestaTexto.trim()) return;
        const actualizada = {
          ...respondingSolicitud,
          estado: 'Resuelto',
          respuesta: respuestaTexto.trim()
        };

        setSolicitudes((prev) => prev.map((s) => (s.id === actualizada.id ? actualizada : s)));

        try {
          const cleanUrl = supabaseUrl.trim().replace(/\/$/, '');
          await fetch(`${cleanUrl}/rest/v1/solicitudes`, {
            method: 'POST',
            headers: getSupabaseHeaders(),
            body: JSON.stringify(actualizada)
          });
        } catch (e) {}

        const dptoFicha = departamentos.find((d) => d.id === actualizada.dpto);
        const telefonoDestino = actualizada.telefono || (dptoFicha ? dptoFicha.telefono : '');

        setRespondingSolicitud(null);
        setRespuestaTexto('');
        showToast(`Solicitud ${actualizada.id} marcada como Resuelta`);

        if (enviarPorWa) {
          abrirModalWhatsApp(
            actualizada.dpto,
            actualizada.vecino,
            telefonoDestino,
            `Respuesta a su solicitud (${actualizada.asunto})`,
            `✅ *Respuesta de Administración:*\n"${actualizada.respuesta}"\n\nTambién puede ver el detalle actualizado ingresando al portal web del condominio.`
          );
        }
      };

      // Verificar PIN para pasar a Modo Administrador
      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === adminPin) {
          setRole('admin');
          setShowPinModal(false);
          setPinInput('');
          showToast('Modo Administrador desbloqueado');
        } else {
          showToast('PIN incorrecto. Por defecto es 1770');
        }
      };

      const solicitudesDelVecino = solicitudes.filter((s) => s.dpto === selectedDptoVecino);
      const respuestasResueltasVecino = solicitudesDelVecino.filter((s) => s.estado === 'Resuelto').length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* NOTIFICACIÓN FLOTANTE (TOAST) */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-3 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              <span className="text-sm font-medium">{toastMsg}</span>
            </div>
          )}

          {/* BARRA SUPERIOR PRINCIPAL */}

                  <p className="text-xs text-slate-500">
                    Tus credenciales de Supabase ya vienen incrustadas por defecto en este archivo <code>index.html</code>.
                  </p>
                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">1. SUPABASE_URL</label>
                      <input
                        type="text"
                        value={supabaseUrl}
                        onChange={(e) => setSupabaseUrl(e.target.value)}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">2. SUPABASE_KEY</label>
                      <input
                        type="password"
                        value={supabaseKey}
                        onChange={(e) => setSupabaseKey(e.target.value)}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-mono"
                      />
                    </div>
                    <div className="flex flex-wrap gap-3 pt-2">
                      <button
                        onClick={() => cargarDesdeSupabase(false)}
                        disabled={isSyncing}
                        className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
                      >
                        🔄 Probar Conexión y Leer desde Supabase
                      </button>
                      <button
                        onClick={sincronizar96DptosASupabase}
                        disabled={isSyncing}
                        className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold"
                      >
                        ☁️ Subir / Sincronizar los 96 Dptos a Supabase
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </main>
          )}

          {/* MODAL PIN ADMINISTRADOR */}
          {showPinModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handlePinSubmit} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                <h3 className="font-extrabold text-slate-900 text-lg">🔒 Acceso Administración</h3>
                <p className="text-xs text-slate-500">
                  Ingresa el PIN de seguridad del Condominio Portal de Lampa para desbloquear la edición de los 96 departamentos.
                </p>
                <input
                  type="password"
                  autoFocus
                  placeholder="Ingresa PIN (1770)"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-center text-lg font-extrabold tracking-widest"
                />
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setShowPinModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                  >
                    Entrar
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL EDITAR DEPARTAMENTO (ADMIN) */}
          {editingDpto && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveDpto} className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-lg">
                    ✏️ Editar Departamento {editingDpto.id}
                  </h3>
                  <button type="button" onClick={() => setEditingDpto(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div className="sm:col-span-2">
                    <label className="font-bold text-slate-700">Nombre Residente</label>
                    <input
                      type="text"
                      value={editingDpto.residente}
                      onChange={(e) => setEditingDpto({ ...editingDpto, residente: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Teléfono WhatsApp</label>
                    <input
                      type="text"
                      value={editingDpto.telefono}
                      onChange={(e) => setEditingDpto({ ...editingDpto, telefono: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Estado de Pago</label>
                    <select
                      value={editingDpto.estado}
                      onChange={(e) => setEditingDpto({ ...editingDpto, estado: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    >
                      <option>Al día</option>
                      <option>Pendiente</option>
                      <option>Moroso</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Gasto Común Base ($)</label>
                    <input
                      type="number"
                      value={editingDpto.gasto_base}
                      onChange={(e) => setEditingDpto({ ...editingDpto, gasto_base: Number(e.target.value) })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Agua / Calefacción ($)</label>
                    <input
                      type="number"
                      value={editingDpto.agua_caliente}
                      onChange={(e) => setEditingDpto({ ...editingDpto, agua_caliente: Number(e.target.value) })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Multas ($)</label>
                    <input
                      type="number"
                      value={editingDpto.multas}
                      onChange={(e) => setEditingDpto({ ...editingDpto, multas: Number(e.target.value) })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Monto Abonado / Pagado ($)</label>
                    <input
                      type="number"
                      value={editingDpto.pagado}
                      onChange={(e) => setEditingDpto({ ...editingDpto, pagado: Number(e.target.value) })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 mt-1"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t">
                  <button type="button" onClick={() => setEditingDpto(null)} className="px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold">
                    Cancelar
                  </button>
                  <button type="submit" className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                    Guardar y Sincronizar en Supabase
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL RESPONDER SOLICITUD (ADMIN) */}
          {respondingSolicitud && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                <h3 className="font-extrabold text-slate-900 text-lg">
                  Responder a Dpto {respondingSolicitud.dpto} ({respondingSolicitud.vecino})
                </h3>
                <p className="text-xs text-slate-600 bg-slate-100 p-3 rounded-xl">
                  <strong>Consulta:</strong> {respondingSolicitud.mensaje}
                </p>
                <textarea
                  rows="4"
                  placeholder="Escribe la respuesta oficial de la Administración..."
                  value={respuestaTexto}
                  onChange={(e) => setRespuestaTexto(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs"
                ></textarea>
                <div className="flex flex-wrap justify-end gap-2">
                  <button
                    onClick={() => setRespondingSolicitud(null)}
                    className="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={() => guardarRespuestaSolicitud(false)}
                    className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                  >
                    Guardar en Portal Web
                  </button>
                  <button
                    onClick={() => guardarRespuestaSolicitud(true)}
                    className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
                  >
                    📲 Responder y Enviar por WhatsApp
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL VISTA PREVIA DE ENVÍO WHATSAPP */}
          {waPreviewModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <h3 className="font-extrabold text-slate-900 text-lg">📲 Notificación Lista para WhatsApp</h3>
                <div className="text-xs space-y-1 bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-emerald-900">
                  <p><strong>Unidad:</strong> Dpto {waPreviewModal.dptoId} ({waPreviewModal.nombreVecino})</p>
                  <p><strong>Teléfono enviando a:</strong> {waPreviewModal.numeroEnvio} {waPreviewModal.modoPrueba ? '(Modo Prueba Activo)' : '(Número Real)'}</p>
                </div>
                <pre className="text-xs bg-slate-100 p-3.5 rounded-xl whitespace-pre-wrap font-sans text-slate-800 border border-slate-200">
                  {waPreviewModal.mensajeCompleto}
                </pre>
                <div className="flex gap-2">
                  <button
                    onClick={() => setWaPreviewModal(null)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold"
                  >
                    Cerrar
                  </button>
                  <a
                    href={waPreviewModal.urlWa}
                    target="_blank"
                    rel="noopener noreferrer"
                    onClick={() => setWaPreviewModal(null)}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold text-center"
                  >
                    Abrir WhatsApp y Enviar
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
